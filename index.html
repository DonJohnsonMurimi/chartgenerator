<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Universal Chart Generator</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- PapaParse (CSV Reader) -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <!-- SheetJS (Excel Reader) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

</head>

<body>

    <!-- ===============================
            HEADER
    ================================ -->

    <header>

        <h1>📊 Dadon Universal Chart Generator</h1>

        <p>Upload a CSV or Excel file and generate interactive charts.</p>

    </header>


    <!-- ===============================
            MAIN CONTAINER
    ================================ -->

    <main class="container">


        <!-- ===============================
                FILE UPLOAD
        ================================ -->

        <section class="upload-section">

            <h2>Upload Dataset</h2>

            <div class="upload-box">

                <div class="input-group">

                    <label>Select CSV File</label>

                    <input
                        type="file"
                        id="csvFile"
                        accept=".csv">

                </div>

                <div class="input-group">

                    <label>Select Excel File</label>

                    <input
                        type="file"
                        id="excelFile"
                        accept=".xlsx,.xls">

                </div>

            </div>

        </section>



        <!-- ===============================
                CHART OPTIONS
        ================================ -->

        <section class="options-section">

            <h2>Chart Options</h2>

            <div class="options">

                <div class="input-group">

                    <label>X-Axis</label>

                    <select id="xAxis">

                        <option value="">Select X-Axis</option>

                    </select>

                </div>



                <div class="input-group">

                    <label>Y-Axis</label>

                    <select id="yAxis">

                        <option value="">Select Y-Axis</option>

                    </select>

                </div>



                <div class="input-group">

                    <label>Chart Type</label>

                    <select id="chartType">

                        <option value="bar">Bar Chart</option>

                        <option value="line">Line Chart</option>

                        <option value="pie">Pie Chart</option>

                        <option value="doughnut">Doughnut Chart</option>

                        <option value="radar">Radar Chart</option>

                        <option value="scatter">Scatter Plot</option>

                    </select>

                </div>

            </div>

        </section>



        <!-- ===============================
                BUTTONS
        ================================ -->

        <section class="button-section">

            <button id="generateChart">

                📈 Generate Chart

            </button>

            <button id="clearChart">

                🗑 Clear Chart

            </button>

        </section>



        <!-- ===============================
                CHART AREA
        ================================ -->

        <section class="chart-section">

            <h2>Chart Preview</h2>

            <div class="chart-container">

                <canvas id="myChart"></canvas>

            </div>

        </section>


    </main>



    <!-- ===============================
            FOOTER
    ================================ -->

    <footer>

        <p>

            DaDon | Universal Chart Generator | 0758 316 818

        </p>

    </footer>



    <!-- JavaScript Files -->

    <script src="js/app.js"></script>

</body>

</html>
